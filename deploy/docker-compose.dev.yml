services:
  db:
    image: postgres:18
    container_name: slu-lab-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clms_db}
      POSTGRES_USER: ${POSTGRES_USER:-clms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CLMS!}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clms_user} -d ${POSTGRES_DB:-clms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev: